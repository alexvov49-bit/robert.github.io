<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой уголок — фото, стихи, книги</title>
<style>
  *{box-sizing:border-box}
  :root{
    --paper:#f4efe6; --card:#ffffff; --ink:#2b2420; --ink-soft:#4a4038;
    --muted:#8a7f75; --line:#e6dccd; --accent:#b8622e;
    --input-bg:#fbf8f3; --hover-bg:#faf5ec;
    --topbar-bg:rgba(250,246,239,.92); --tabs-bg:#eee6d9;
    --badge-bg:#f3ece0; --badge-fg:#9a6a3f;
    --toast-bg:#2b2420; --toast-fg:#ffffff;
    --overlay-bg:rgba(40,32,26,.45);
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-serif:Georgia,'Times New Roman',serif;
    --radius:16px;
  }
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-body);
    background:var(--paper);color:var(--ink);
    min-height:100vh;-webkit-font-smoothing:antialiased;
    transition:background-color .4s ease, color .4s ease;
  }
  h1,h2,h3,.serif{font-family:var(--font-serif);font-weight:600;letter-spacing:.2px}

  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 20px;
    background:var(--topbar-bg);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    transition:background-color .4s ease, border-color .4s ease;
  }
  .brand{font-family:var(--font-serif);font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--ink)}
  .tabs{display:flex;gap:4px;background:var(--tabs-bg);padding:4px;border-radius:12px}
  .tab{
    border:none;background:transparent;padding:8px 16px;border-radius:9px;cursor:pointer;
    font-size:14px;font-weight:600;color:var(--muted);transition:.18s;font-family:inherit;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .spacer{flex:1}
  .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{
    border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;
    cursor:pointer;transition:.18s;font-family:inherit;
  }
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .btn-primary:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:var(--hover-bg)}
  .btn-danger{background:#c9463c;color:#fff}
  .btn-icon{
    padding:0;width:38px;height:38px;border-radius:10px;
    background:var(--card);border:1px solid var(--line);cursor:pointer;
    font-size:16px;display:flex;align-items:center;justify-content:center;
    transition:.15s;font-family:inherit;color:var(--ink);
  }
  .btn-icon:hover{background:var(--hover-bg)}

  .user-chip{
    display:inline-flex;align-items:center;gap:8px;
    padding:5px 12px 5px 5px;border-radius:999px;
    background:var(--hover-bg);font-size:13px;font-weight:600;
    max-width:170px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    color:var(--ink);
  }
  .user-chip .avatar{width:26px;height:26px;font-size:12px;border-width:1px;flex-shrink:0}

  main{max-width:1180px;margin:0 auto;padding:26px 20px 80px}

  .feed-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .feed-head h1{margin:0;font-size:26px;margin-right:auto;color:var(--ink)}
  .search-input{
    padding:9px 14px;border:1px solid var(--line);border-radius:11px;
    font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);
    outline:none;flex:0 1 240px;min-width:160px;transition:.15s;
  }
  .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(184,98,46,.12)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;
    font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:.18s;font-family:inherit;
  }
  .chip:hover{color:var(--ink)}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 2px 12px rgba(0,0,0,.05);
    transition:box-shadow .2s, transform .2s, background-color .4s;
    animation:fade .35s ease;
  }
  .card:hover{box-shadow:0 8px 26px rgba(0,0,0,.11);transform:translateY(-2px)}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card-head{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
  .avatar{
    width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--tabs-bg);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);
    font-size:15px;flex-shrink:0;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);
  }
  .card-author{font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
  .card-author:hover{color:var(--accent)}
  .card-date{font-size:12px;color:var(--muted)}

  .card-body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
  .badge{
    align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.4px;
    text-transform:uppercase;padding:4px 10px;border-radius:999px;
    background:var(--badge-bg);color:var(--badge-fg);
  }
  .card-title{font-size:17px;margin:0;line-height:1.35;color:var(--ink)}
  .card-text{
    font-size:14.5px;line-height:1.65;color:var(--ink-soft);white-space:pre-wrap;margin:0;
    font-family:var(--font-serif);
  }
  .card-text.clamped{
    display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-img{width:100%;display:block;border-radius:12px;max-height:340px;object-fit:cover;background:var(--tabs-bg)}
  .more-btn{
    align-self:flex-start;background:none;border:none;color:var(--accent);font-weight:700;
    font-size:13px;cursor:pointer;padding:0;font-family:inherit;
  }
  .more-btn:hover{text-decoration:underline}

  .pdf-attachment{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;background:var(--input-bg);
    border:1px solid var(--line);border-radius:12px;
  }
  .pdf-icon{font-size:22px;flex-shrink:0}
  .pdf-info{flex:1;min-width:0}
  .pdf-name{
    font-size:13px;font-weight:600;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .pdf-size{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .pdf-attachment .btn{padding:6px 10px;font-size:12.5px}

  /* === Медиа: видео и аудио === */
  .card-media{
    width:100%;display:block;border-radius:12px;max-height:400px;
    background:#000;object-fit:contain;
  }
  .audio-attachment{
    display:flex;gap:12px;align-items:flex-start;
    padding:10px;background:var(--input-bg);
    border:1px solid var(--line);border-radius:12px;
  }
  .audio-cover{
    width:80px;height:80px;border-radius:10px;object-fit:cover;flex-shrink:0;
  }
  .audio-cover-placeholder{
    display:flex;align-items:center;justify-content:center;
    font-size:32px;background:var(--badge-bg);
  }
  .audio-info{flex:1;min-width:0}
  .audio-info audio{width:100%;display:block;margin-top:4px}
  .audio-name{
    font-size:13.5px;font-weight:600;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .audio-meta{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

  .card-foot{
    display:flex;justify-content:space-between;align-items:center;
    padding:0 16px 14px;gap:8px;
  }
  .foot-left{display:flex;gap:6px;align-items:center}
  .like-btn{
    background:none;border:none;padding:5px 10px;border-radius:9px;
    cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);font-family:inherit;
    display:inline-flex;align-items:center;gap:5px;transition:.15s;
  }
  .like-btn:hover{background:var(--hover-bg)}
  .like-btn.liked{color:#c9463c}
  .del-btn{
    background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;
    font-family:inherit;padding:4px 8px;border-radius:6px;
  }
  .del-btn:hover{color:#c9463c;background:#fbeeec}

  .empty{
    text-align:center;padding:70px 20px;color:var(--muted);
    background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  }
  .empty h3{margin:0 0 8px;color:var(--ink)}

  .profile{
    border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);
    box-shadow:0 4px 24px rgba(0,0,0,.07);
  }
  .profile-cover{height:190px;background:var(--accent);background-size:cover;background-position:center;position:relative}
  .profile-cover::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.22))}
  .cover-sticker{
    position:absolute;left:var(--x);top:var(--y);z-index:2;
    transform:translate(-50%,-50%) rotate(var(--r,0deg));
    font-size:32px;line-height:1;pointer-events:none;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.3));
  }
  .profile-main{display:flex;gap:20px;padding:0 28px 24px;margin-top:-52px;position:relative;flex-wrap:wrap;align-items:flex-end}
  .profile-avatar{
    width:110px;height:110px;border-radius:50%;object-fit:cover;background:var(--tabs-bg);
    border:5px solid var(--card);box-shadow:0 4px 16px rgba(0,0,0,.12);
    display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:var(--muted);
    flex-shrink:0;
  }
  .profile-info{flex:1;min-width:220px;padding-bottom:4px}
  .profile-name{margin:0;font-size:28px;}
  .profile-bio{margin:6px 0 0;color:var(--ink-soft);font-size:15px;line-height:1.6;white-space:pre-wrap;font-family:var(--font-serif)}
  .profile-stats{display:flex;gap:22px;padding:0 28px 26px;flex-wrap:wrap}
  .stat{text-align:center}
  .stat b{display:block;font-size:21px;font-family:var(--font-serif);color:var(--ink)}
  .stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

  .section-title{font-size:19px;margin:34px 0 16px;display:flex;align-items:center;gap:12px;color:var(--ink)}
  .section-title::after{content:'';flex:1;height:1px;background:var(--line)}

  .overlay{
    position:fixed;inset:0;background:var(--overlay-bg);backdrop-filter:blur(3px);
    display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;
    z-index:200;overflow-y:auto;animation:fade .2s ease;
  }
  .modal{
    background:var(--card);border-radius:20px;padding:26px;width:100%;max-width:560px;
    box-shadow:0 24px 60px rgba(0,0,0,.28);animation:pop .25s ease;color:var(--ink);
  }
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
  .modal h2{margin:0 0 18px;font-size:22px;color:var(--ink)}
  .field{display:block;margin-bottom:16px}
  .field > span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
  input[type=text], input[type=password], input[type=file], textarea, select.full{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;
    font-size:14.5px;font-family:inherit;background:var(--input-bg);color:var(--ink);outline:none;
    transition:.15s;
  }
  input[type=text]:focus, input[type=password]:focus, textarea:focus, select.full:focus{
    border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px rgba(184,98,46,.12);
  }
  textarea{resize:vertical;min-height:120px;line-height:1.6}
  input[type=file]{padding:8px;cursor:pointer;font-size:13px}
  input[type=color]{
    width:100%;height:44px;padding:4px;border:1px solid var(--line);border-radius:11px;
    background:var(--input-bg);cursor:pointer;
  }
  .type-picker{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .type-btn{
    flex:1;min-width:86px;padding:12px 6px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--input-bg);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);
    font-family:inherit;transition:.15s;
  }
  .type-btn:hover{border-color:var(--muted)}
  .type-btn.active{border-color:var(--accent);background:var(--badge-bg);color:var(--accent)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
  .preview-img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:16px;display:block}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .sticker-picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .sticker-toggle{
    width:42px;height:42px;border-radius:50%;border:2px solid var(--line);
    background:var(--input-bg);font-size:21px;cursor:pointer;transition:.15s;
    display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;
  }
  .sticker-toggle:hover{border-color:var(--accent);transform:scale(1.08)}
  .sticker-toggle.active{border-color:var(--accent);background:var(--badge-bg);transform:scale(1.1)}
  .sticker-counter{font-size:12.5px;color:var(--muted);margin:0 0 18px}

  .gradient-picker{display:flex;flex-wrap:wrap;gap:8px}
  .gradient-swatch{
    width:44px;height:44px;border-radius:10px;border:2px solid var(--line);
    cursor:pointer;transition:.15s;padding:0;flex-shrink:0;
  }
  .gradient-swatch:hover{border-color:var(--accent);transform:scale(1.06)}
  .gradient-swatch.active{border-color:var(--accent);border-width:3px}

  #gateScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;background:var(--paper);
  }
  .gate-card{
    background:var(--card);border-radius:22px;padding:34px 30px;
    width:100%;max-width:420px;
    box-shadow:0 20px 60px rgba(0,0,0,.13);
    border:1px solid var(--line);
    animation:pop .3s ease;color:var(--ink);
  }
  .gate-card h1{margin:0 0 8px;font-size:25px;text-align:center}
  .gate-card p.lead{margin:0 0 22px;color:var(--muted);text-align:center;font-size:14px;line-height:1.55}
  .gate-card .field{margin-bottom:14px}
  .gate-btn{width:100%;padding:13px;font-size:15px;margin-top:6px}
  .gate-divider{
    display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:12px;
    text-transform:uppercase;letter-spacing:.6px;
  }
  .gate-divider::before,.gate-divider::after{content:'';flex:1;height:1px;background:var(--line)}
  .gate-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.55}
  .gate-err{
    background:#fbeeec;color:#c9463c;padding:10px 14px;border-radius:10px;
    font-size:13px;margin-bottom:14px;display:none;line-height:1.45;
  }
  .gate-err.show{display:block}

  .note{
    background:var(--input-bg);border-left:3px solid var(--accent);padding:11px 14px;
    border-radius:8px;font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 16px;
  }

  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px;margin-bottom:8px}
  .theme-card{
    background:var(--input-bg);border:2px solid var(--line);border-radius:14px;
    padding:9px;cursor:pointer;transition:.18s;font-family:inherit;text-align:left;
  }
  .theme-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .theme-card.active{border-color:var(--accent);background:var(--badge-bg)}
  .theme-preview{
    height:66px;border-radius:8px;border:1px solid;position:relative;
    overflow:hidden;margin-bottom:8px;
  }
  .theme-preview-card{position:absolute;left:10px;right:10px;top:10px;bottom:26px;border-radius:6px}
  .theme-preview-accent{position:absolute;bottom:8px;left:10px;right:55%;height:8px;border-radius:4px}
  .theme-name{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--toast-bg);color:var(--toast-fg);padding:12px 22px;border-radius:12px;font-size:14px;
    font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:400;
    box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .vol-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .vol-row input[type=range]{flex:1;accent-color:var(--accent)}

  @media(max-width:640px){
    .topbar{padding:10px 12px;gap:8px}
    .brand span{display:none}
    .tabs{order:3;width:100%;justify-content:center}
    main{padding:18px 14px 70px}
    .profile-main{padding:0 18px 18px}
    .profile-stats{padding:0 18px 20px}
    .feed-head h1{font-size:22px;margin-right:0;width:100%}
    .search-input{flex:1 1 100%}
    .row{grid-template-columns:1fr}
    .user-chip span{display:none}
    .audio-cover{width:60px;height:60px}
  }
</style>
</head>
<body>

<div id="gateScreen"></div>

<div id="appRoot" style="display:none">
  <header class="topbar">
    <div class="brand">📖 <span>Мой уголок</span></div>
    <nav class="tabs">
      <button class="tab active" data-view="feed">Лента</button>
      <button class="tab" data-view="profile">Профиль</button>
    </nav>
    <div class="spacer"></div>
    <div class="actions">
      <span class="user-chip" id="currentUserChip"></span>
      <button class="btn-icon" id="musicBtn" title="Музыка">🔇</button>
      <button class="btn-icon" id="themeBtn" title="Стиль интерфейса">🎨</button>
      <button class="btn btn-ghost" id="addFriendBtn" title="Добавить друга">+ Друг</button>
      <button class="btn btn-ghost" id="settingsBtn" title="Настройки">⚙</button>
      <button class="btn btn-primary" id="addPostBtn">+ Добавить</button>
      <button class="btn btn-ghost" id="logoutBtn">Выйти</button>
    </div>
  </header>

  <main>
    <section id="feedView">
      <div class="feed-head">
        <h1 class="serif">Лента уголка</h1>
        <input class="search-input" id="searchInput" placeholder="🔍 Поиск по записям…">
        <div class="chips" id="chips">
          <button class="chip active" data-filter="all">Всё</button>
          <button class="chip" data-filter="photo">📷 Фото</button>
          <button class="chip" data-filter="poem">✒️ Стихи</button>
          <button class="chip" data-filter="book">📚 Книги</button>
          <button class="chip" data-filter="video">🎬 Видео</button>
          <button class="chip" data-filter="music">🎵 Музыка</button>
        </div>
      </div>
      <div class="grid" id="feedGrid"></div>
    </section>

    <section id="profileView" style="display:none"></section>
  </main>
</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================
   КОНСТАНТЫ И ТЕМЫ
   ========================================================= */
const STORAGE_KEY = 'moy-ugolok-v1';
const SESSION_KEY = 'moy-ugolok-session';
const AUTOLOCK_MS = 10 * 60 * 1000;
const REMEMBER_MS = 30 * 86400000;
const TYPES = { photo:'Фото', poem:'Стих', book:'Книга', video:'Видео', music:'Музыка' };
const PDF_MAX = 2 * 1024 * 1024;
const VIDEO_MAX = 5 * 1024 * 1024;
const AUDIO_MAX = 3 * 1024 * 1024;
const STICKER_MAX = 20;

const STICKER_PACK = [
  '🌟','✨','🌙','⭐','💫','🌸','🌺','🌻','🍀','🌈',
  '🦋','🎈','💛','💜','🎨','📚','🖋️','🕯️','☕','🌿',
  '🍁','❄️','🔥','🎵','🦫','🐈','🐦','🍄','🌊','☀️',
  '💖','💎','🪐','🌷','🪴','🍂','🎭','🎪','🏵️','🌼',
  '🪶','📖','☔','🌠','🌴','🦊','🦉','🌾','🧸','🍓',

/* =========================================================
   МУЗЫКА (фоновая)
   ========================================================= */
class AmbientMusic {
  constructor(){
    this.ctx = null; this.master = null; this.playing = false;
    this.timer = null; this.padNodes = []; this.mood = null;
    this.volume = 0.22;
  }
  init(){
    if(this.ctx) return;
    try{
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.volume;
      this.master.connect(this.ctx.destination);
    }catch(e){ console.warn('Web Audio недоступен', e); }
  }
  setVolume(v){ this.volume = v; if(this.master) this.master.gain.value = v; }
  setMood(mood){
    this.mood = mood;
    if(this.playing){ this.stopInternal(); this.startInternal(); }
  }
  async start(){
    if(!this.mood) return false;
    this.init();
    if(!this.ctx) return false;
    try{ await this.ctx.resume(); }catch(e){}
    this.playing = true;
    this.startInternal();
    return true;
  }
  stop(){ this.playing = false; this.stopInternal(); }
  startInternal(){ this.buildPad(); this.scheduleNote(); }
  stopInternal(){
    clearTimeout(this.timer);
    this.padNodes.forEach(n => {
      try{ n.osc.stop(); if(n.lfo) n.lfo.stop(); n.gain.disconnect(); }catch(e){}
    });
    this.padNodes = [];
  }
  buildPad(){
    const m = this.mood;
    [0, 1].forEach(i => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();
      const lfo = this.ctx.createOscillator();
      const lfoGain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = m.root / 2;
      osc.detune.value = (i === 0 ? -4 : 4);
      filter.type = 'lowpass';
      filter.frequency.value = 500;
      gain.gain.value = 0.05;
      lfo.frequency.value = 0.04 + i * 0.02;
      lfoGain.gain.value = 0.025;
      lfo.connect(lfoGain); lfoGain.connect(gain.gain); lfo.start();
      osc.connect(filter); filter.connect(gain); gain.connect(this.master);
      osc.start();
      this.padNodes.push({ osc, gain, lfo });
    });
  }
  scheduleNote(){
    if(!this.playing) return;
    const m = this.mood;
    const delay = m.tempo * (0.7 + Math.random() * 0.6);
    this.timer = setTimeout(() => {
      if(!this.playing) return;
      this.playNote();
      this.scheduleNote();
    }, delay);
  }
  playNote(){
    const m = this.mood;
    const semis = m.scale[Math.floor(Math.random() * m.scale.length)];
    const octave = Math.random() < 0.5 ? 1 : 2;
    const freq = m.root * Math.pow(2, semis / 12) * octave;
    const now = this.ctx.currentTime;
    const dur = 2.5 + Math.random() * 2.5;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = m.wave === 'triangle' ? 'triangle' : 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.13, now + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain); gain.connect(this.master);
    osc.start(now); osc.stop(now + dur + 0.1);
  }
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function fmtDate(ts){
  return new Date(ts).toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
}
function fmtSize(bytes){
  if(bytes < 1024) return bytes + ' Б';
  if(bytes < 1048576) return (bytes/1024).toFixed(0) + ' КБ';
  return (bytes/1048576).toFixed(1) + ' МБ';
}
function hashPass(pw){
  let h = 5381;
  const s = 'salt-ugolok-v1::' + pw;
  for(let i=0;i<s.length;i++) h = ((h<<5)+h) ^ s.charCodeAt(i);
  return (h>>>0).toString(16);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2400);
}

function readImage(file, maxSide = 1100, quality = 0.72){
  return new Promise((resolve, reject) => {
    if(!file) return resolve('');
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxSide || height > maxSide){
          const k = maxSide / Math.max(width, height);
          width = Math.round(width * k); height = Math.round(height * k);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('bad image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('read error'));
    reader.readAsDataURL(file);
  });
}

function readPDF(file){
  return new Promise((resolve, reject) => {
    if(file.size > PDF_MAX){
      return reject(new Error(`PDF больше ${fmtSize(PDF_MAX)}. Попробуйте файл поменьше.`));
    }
    const reader = new FileReader();
    reader.onload = () => resolve({ data: reader.result, name: file.name, size: file.size });
    reader.onerror = () => reject(new Error('Не удалось прочитать PDF'));
    reader.readAsDataURL(file);
  });
}

function readMedia(file, maxSize, kind){
  return new Promise((resolve, reject) => {
    if(file.size > maxSize){
      return reject(new Error(`${kind} больше ${fmtSize(maxSize)}. Попробуйте файл поменьше.`));
    }
    const reader = new FileReader();
    reader.onload = () => resolve({ data: reader.result, name: file.name, size: file.size });
    reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
    reader.readAsDataURL(file);
  });
}

        <input type="password" id="setupPass" placeholder="Минимум 4 символа" autocomplete="new-password">
      </label>
      <label class="field"><span>Повторите пароль</span>
        <input type="password" id="setupPass2" autocomplete="new-password">
      </label>
      <button class="btn btn-primary gate-btn" id="setupBtn">Создать уголок</button>
      <p class="gate-hint">Профили Вики (пароль <b>Fixl</b>) и Дани (пароль <b>1234</b>) уже готовы.</p>
    </div>`;
  const errEl = document.getElementById('gateErr');
  const showErr = m => { errEl.textContent = m; errEl.classList.add('show'); };
  document.getElementById('setupBtn').onclick = () => {
    const name = document.getElementById('setupName').value.trim();
    const p1 = document.getElementById('setupPass').value;
    const p2 = document.getElementById('setupPass2').value;
    if(!name) return showErr('Введите имя');
    if(p1.length < 4) return showErr('Пароль должен быть не короче 4 символов');
    if(p1 !== p2) return showErr('Пароли не совпадают');
    owner.name = name;
    owner.passHash = hashPass(p1);
    state.authSetup = true;
    state.currentUserId = owner.id;
    if(!save()) return showErr('Не удалось сохранить данные');
    saveSession(owner.id, true);
    startApp();
  };
}

function renderLogin(){
  document.getElementById('gateScreen').innerHTML = `
    <div class="gate-card">
      <h1 class="serif">Вход в уголок</h1>
      <p class="lead">Хозяева и друзья входят по паролю. Любой желающий может посмотреть записи как зритель.</p>
      <div class="gate-err" id="gateErr"></div>
      <label class="field"><span>Кто вы</span>
        <select class="full" id="loginUser">
          ${state.users.map(u => `<option value="${u.id}" ${u.id === state.currentUserId ? 'selected' : ''}>${esc(u.name)}${u.id === 'u3' ? ' 🦫' : ''}</option>`).join('')}
        </select>
      </label>
      <label class="field"><span>Пароль</span>
        <input type="password" id="loginPass" autocomplete="current-password">
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin:2px 0 6px;cursor:pointer">
        <input type="checkbox" id="loginRemember" checked> Запомнить меня на 30 дней
      </label>
      <button class="btn btn-primary gate-btn" id="loginBtn">Войти</button>

      <div class="gate-divider">или</div>

      <button class="btn btn-ghost gate-btn" id="viewerBtn">👁 Войти как зритель (без пароля)</button>
      <p class="gate-hint">Зритель может читать стихи и книги, смотреть видео и слушать музыку, но не может публиковать, лайкать или менять профили.</p>
    </div>`;

  const errEl = document.getElementById('gateErr');
  const passEl = document.getElementById('loginPass');
  passEl.focus();
  passEl.addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('loginBtn').click(); });

  document.getElementById('loginBtn').onclick = () => {
    const userId = document.getElementById('loginUser').value;
    const pw = passEl.value;
    const remember = document.getElementById('loginRemember').checked;
    const user = state.users.find(u => u.id === userId);
    if(!user) return;
    if(loginAttempts >= 5){
      errEl.textContent = 'Слишком много неудачных попыток. Перезагрузите страницу.';
      errEl.classList.add('show'); return;
    }
    if(!user.passHash || hashPass(pw) !== user.passHash){
      loginAttempts++;
      errEl.textContent = 'Неверный пароль. Попробуйте ещё раз.';
      errEl.classList.add('show');
      passEl.value = ''; return;
    }
    loginAttempts = 0;
    viewerMode = false;
    state.currentUserId = user.id;
    saveSession(user.id, remember);
    startApp();
  };

  document.getElementById('viewerBtn').onclick = () => {
    viewerMode = true;
    startApp();
  };
}

/* =========================================================
   СТАРТ/ВЫХОД
   ========================================================= */
async function startApp(){
  document.getElementById('gateScreen').style.display = 'none';
  document.getElementById('gateScreen').innerHTML = '';
  document.getElementById('appRoot').style.display = '';

  viewingProfileId = viewerMode ? state.users[0].id : state.currentUserId;

  document.getElementById('addPostBtn').style.display = viewerMode ? 'none' : '';
  document.getElementById('addFriendBtn').style.display = viewerMode ? 'none' : '';
  document.getElementById('settingsBtn').style.display = viewerMode ? 'none' : '';

  applyUITheme(state.uiTheme);
  musicEngine.setVolume(state.musicVolume);
  renderAll();
  resetLockTimer();

  if(state.musicOn){
    const ok = await musicEngine.start();
    updateMusicBtn();
    if(!ok){
      const retry = async () => { await musicEngine.start(); updateMusicBtn(); };
      document.addEventListener('click', retry, { once: true });
    }
  } else {
    updateMusicBtn();
  }
}

function logout(expired){
  clearTimeout(lockTimer);
  clearSession();
  musicEngine.stop();
  viewerMode = false;
  load();
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('gateScreen').style.display = 'flex';
  renderGate();
  if(expired) toast('Сессия истекла — войдите снова');
}

function resetLockTimer(){
  clearTimeout(lockTimer);
  if(viewerMode) return;
  lockTimer = setTimeout(() => {
    if(document.getElementById('appRoot').style.display !== 'none') logout(true);
  }, AUTOLOCK_MS);
}

['mousemove','keydown','click','scroll','touchstart'].forEach(ev => {
  document.addEventListener(ev, () => {
    if(document.getElementById('appRoot').style.display !== 'none') resetLockTimer();
  }, {passive:true});
});

function postCardHTML(post){
  const author = userById(post.userId) || { name:'Неизвестный', avatar:'' };
  const isMine = !viewerMode && post.userId === state.currentUserId;
  const long = (post.content || '').length > 420;
  const likes = post.likes || [];
  const liked = !viewerMode && likes.includes(state.currentUserId);

  // Для видео и музыки картинка идёт как постер/обложка, отдельно её не выводим
  const showImg = post.image && post.type !== 'video' && post.type !== 'music';
  const img = showImg
    ? `<img class="card-img" src="${post.image}" alt="${esc(post.title)}" loading="lazy">` : '';

  const videoBlock = post.videoData ? `
    <video class="card-media" controls preload="metadata"
      ${post.image ? `poster="${post.image}"` : ''}
      src="${post.videoData}"></video>` : '';

  const audioBlock = post.audioData ? `
    <div class="audio-attachment">
      ${post.image
        ? `<img class="audio-cover" src="${post.image}" alt="">`
        : `<div class="audio-cover audio-cover-placeholder">🎵</div>`}
      <div class="audio-info">
        <div class="audio-name">${esc(post.audioName || 'Трек')}</div>
        <div class="audio-meta">Аудио${post.audioSize ? ' · ' + fmtSize(post.audioSize) : ''}</div>
        <audio controls preload="metadata" src="${post.audioData}"></audio>
      </div>
    </div>` : '';

  const text = post.content
    ? `<p class="card-text ${long ? 'clamped' : ''}" id="txt-${post.id}">${esc(post.content)}</p>
       ${long ? `<button class="more-btn" data-more="${post.id}">Читать дальше →</button>` : ''}` : '';

  const pdfBlock = post.pdfData ? `
    <div class="pdf-attachment">
      <div class="pdf-icon">📕</div>
      <div class="pdf-info">
        <div class="pdf-name">${esc(post.pdfName || 'книга.pdf')}</div>
        <div class="pdf-size">PDF${post.pdfSize ? ' · ' + fmtSize(post.pdfSize) : ''}</div>
      </div>
      <a href="${post.pdfData}" target="_blank" rel="noopener" class="btn btn-ghost">Открыть</a>
      <a href="${post.pdfData}" download="${esc(post.pdfName || 'book.pdf')}" class="btn btn-ghost" title="Скачать">⭳</a>
    </div>` : '';

  let footer = '';
  if(viewerMode){
    if(likes.length){
      footer = `<div class="card-foot"><span class="like-btn" style="cursor:default">❤️ ${likes.length}</span></div>`;
    }
  } else {
    footer = `
      <div class="card-foot">
        <div class="foot-left">
          <button class="like-btn ${liked ? 'liked' : ''}" data-like="${post.id}">
            ${liked ? '❤️' : '🤍'} ${likes.length || ''}
          </button>
        </div>
        ${isMine ? `<button class="del-btn" data-del="${post.id}">Удалить</button>` : ''}
      </div>`;
  }

  return `
    <article class="card" data-id="${post.id}">
      <div class="card-head">
        ${avatarHTML(author, 'avatar')}
        <div>
          <div class="card-author" data-author="${author.id}">${esc(author.name)}</div>
          <div class="card-date">${fmtDate(post.date)}</div>
        </div>
      </div>
      <div class="card-body">
        <span class="badge">${TYPES[post.type] || 'Запись'}</span>
        ${post.title ? `<h3 class="card-title">${esc(post.title)}</h3>` : ''}
        ${img}
        ${videoBlock}
        ${audioBlock}
        ${pdfBlock}
        ${text}
      </div>
      ${footer}
    </article>`;
}

function matchesSearch(post, q){
  if(!q) return true;
  const ql = q.toLowerCase();
  const author = userById(post.userId);
  return (post.title||'').toLowerCase().includes(ql)
      || (post.content||'').toLowerCase().includes(ql)
      || (post.pdfName||'').toLowerCase().includes(ql)
      || (post.videoName||'').toLowerCase().includes(ql)
      || (post.audioName||'').toLowerCase().includes(ql)
      || (author && author.name.toLowerCase().includes(ql));
}

function renderFeed(){
  const grid = document.getElementById('feedGrid');
  let posts = [...state.posts].sort((a,b) => b.date - a.date);
  if(feedFilter !== 'all') posts = posts.filter(p => p.type === feedFilter);
  if(searchQuery) posts = posts.filter(p => matchesSearch(p, searchQuery));

  if(!posts.length){
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <h3 class="serif">${searchQuery ? 'Ничего не найдено' : 'Пока здесь пусто'}</h3>
        <p>${searchQuery ? 'Попробуйте другой запрос.' : (viewerMode ? 'Загляните позже 🌿' : 'Нажмите «+ Добавить», чтобы опубликовать первую запись.')}</p>
      </div>`;
    return;
  }
  grid.innerHTML = posts.map(postCardHTML).join('');
}

function renderProfile(){
  const user = userById(viewingProfileId) || state.users[0];
  const isMe = !viewerMode && user.id === state.currentUserId;
  const myPosts = state.posts.filter(p => p.userId === user.id).sort((a,b) => b.date - a.date);
  const counts = { photo:0, poem:0, book:0, video:0, music:0 };
  myPosts.forEach(p => { if(counts[p.type] !== undefined) counts[p.type]++; });

  const coverBase = user.theme.bgGradient
    ? `background:${user.theme.bgGradient};`
    : `background-color:${esc(user.theme.bg)};`;
  const coverImage = user.theme.bgImage
    ? `background-image:url('${user.theme.bgImage}');background-size:cover;background-position:center;` : '';
  const coverStyle = coverBase + coverImage;

  const coverStickers = (user.stickers || []).slice(0, STICKER_POS.length).map((s, i) => {
    const p = STICKER_POS[i];
    return `<span class="cover-sticker" style="--x:${p.x}%;--y:${p.y}%;--r:${p.r}deg">${s}</span>`;
  }).join('');

  const body = myPosts.length
    ? `<div class="grid">${myPosts.map(postCardHTML).join('')}</div>`
    : `<div class="empty">
         <h3 class="serif">${isMe ? 'У вас' : 'У ' + esc(user.name)} ещё нет записей</h3>
         <p>${isMe ? 'Нажмите «+ Добавить» — и здесь появится первый стих, фото, книга, видео или трек.' : 'Загляните позже 🌿'}</p>
       </div>`;

  document.getElementById('profileView').innerHTML = `
    <div class="profile">
      <div class="profile-cover" style="${coverStyle}">${coverStickers}</div>
      <div class="profile-main">
        ${avatarHTML(user, 'profile-avatar')}
        <div class="profile-info">
          <h1 class="profile-name serif" style="color:${esc(user.theme.accent)}">${esc(user.name)}</h1>
          <p class="profile-bio">${esc(user.bio) || '<i style="opacity:.6">Пока без описания…</i>'}</p>
        </div>
        ${isMe ? `<button class="btn btn-ghost" id="editProfileBtn" style="margin-bottom:6px">✎ Оформить страницу</button>` : ''}
      </div>
      <div class="profile-stats">
        <div class="stat"><b>${counts.photo}</b><span>фото</span></div>
        <div class="stat"><b>${counts.poem}</b><span>стихов</span></div>
        <div class="stat"><b>${counts.book}</b><span>книг</span></div>
        <div class="stat"><b>${counts.video}</b><span>видео</span></div>
        <div class="stat"><b>${counts.music}</b><span>треков</span></div>
        <div class="stat"><b>${myPosts.length}</b><span>всего</span></div>
      </div>
    </div>
    <h2 class="section-title">Записи ${isMe ? 'на моей странице' : esc(user.name)}</h2>
    ${body}
  `;
  if(isMe) document.getElementById('editProfileBtn').onclick = openProfileModal;
}

function switchView(view){
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.view === view));

    const content = contentEl.value.trim();
    if(type === 'photo' && !imageData){ toast('Добавьте фотографию 📷'); return; }
    if(type === 'poem' && !content){ toast('Стихотворение не может быть пустым ✒️'); return; }
    if(type === 'book' && !content && !pdfData){ toast('Добавьте аннотацию или PDF книгу 📚'); return; }
    if(type === 'video' && !videoData){ toast('Добавьте видеофайл 🎬'); return; }
    if(type === 'music' && !audioData){ toast('Добавьте аудиофайл 🎵'); return; }
    if(!title && !content && !imageData && !pdfData && !videoData && !audioData){
      toast('Заполните хотя бы заголовок или текст'); return;
    }

    const post = {
      id: uid(), userId: state.currentUserId, type,
      title: title || (TYPES[type] + ' без названия'),
      content, image: imageData, likes: [], date: Date.now()
    };
    if(pdfData){ post.pdfData = pdfData; post.pdfName = pdfName; post.pdfSize = pdfSize; }
    if(videoData){ post.videoData = videoData; post.videoName = videoName; post.videoSize = videoSize; }
    if(audioData){ post.audioData = audioData; post.audioName = audioName; post.audioSize = audioSize; }

    state.posts.push(post);
    if(!save()){ state.posts.pop(); return; }
    closeModal();
    toast('Опубликовано ✨');
    renderFeed();
    if(document.getElementById('profileView').style.display !== 'none') renderProfile();
  };
}

    else {

    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed.users || !parsed.posts) throw new Error('bad');
        if(!confirm('Заменить все текущие данные загруженной копией?')) return;
        state = parsed;
        state.users.forEach(u => {

        if(!state.authSetup){ clearSession(); renderGate(); }
        else {
          applyUITheme(state.uiTheme);
          musicEngine.setVolume(state.musicVolume);

          toast('Копия загружена ✅');
        }
      }catch(err){ alert('Не получилось прочитать файл. Убедитесь, что это копия «Моего уголка».'); }
    };
    reader.readAsText(file);
  };

  document.getElementById('wipeBtn').onclick = () => {
    if(!confirm('Точно удалить ВСЁ: профили, пароли, фото, PDF, видео, музыку, стихи и книги?')) return;
    if(!confirm('Это действие нельзя отменить. Продолжить?')) return;
    localStorage.removeItem(STORAGE_KEY);
    clearSession();
    musicEngine.stop();
    state = defaultState();
    closeModal();
    renderGate();
    toast('Всё очищено');
  };
}

document.querySelector('main').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if(del){
    if(confirm('Удалить эту запись?')){
      state.posts = state.posts.filter(p => p.id !== del.dataset.del);
      save(); renderFeed();
      if(document.getElementById('profileView').style.display !== 'none') renderProfile();
      toast('Запись удалена');
    }
    return;
  }
  const like = e.target.closest('[data-like]');
  if(like){
    if(viewerMode) return;
    const post = state.posts.find(p => p.id === like.dataset.like);
    if(!post) return;
    post.likes = post.likes || [];
    const idx = post.likes.indexOf(state.currentUserId);
    if(idx === -1) post.likes.push(state.currentUserId);
    else post.likes.splice(idx, 1);
    save(); renderFeed();
    if(document.getElementById('profileView').style.display !== 'none') renderProfile();
    return;
  }
  const more = e.target.closest('[data-more]');
  if(more){
    const p = document.getElementById('txt-' + more.dataset.more);
    if(p){
      p.classList.toggle('clamped');
      more.textContent = p.classList.contains('clamped') ? 'Читать дальше →' : '← Свернуть';
    }
    return;
  }
  const author = e.target.closest('[data-author]');
  if(author) openAuthorProfile(author.dataset.author);
});

if(session && state.authSetup){
  const user = state.users.find(u => u.id === session.userId);
  if(user){ viewerMode = false; state.currentUserId = user.id; startApp(); }
  else { clearSession(); renderGate(); }
} else {
  renderGate();
}
</script>
